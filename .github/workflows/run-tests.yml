name: run-tests

# A branch pushed to this repository with an open pull request matched both
# triggers, so every pull request ran the whole 6-job matrix twice. `push` is now
# limited to the default branch; branch pushes are covered by `pull_request`,
# which also covers forks.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v5 targets Filament 5 only; Laravel 12 and 13 are both exercised, and
        # Laravel 12 is also resolved against its lowest versions.
        include:
          - { php: '8.3', laravel: '12.*', testbench: '^10.10', stability: prefer-lowest }
          - { php: '8.4', laravel: '12.*', testbench: '^10.10', stability: prefer-stable }
          - { php: '8.5', laravel: '13.*', testbench: '^11.0', stability: prefer-stable }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest --no-coverage

  # Single stable context for branch protection: the matrix can change freely
  # without the required check having to be renamed in the repository settings.
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Fail unless every matrix job succeeded
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
