name: run-tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Laravel x Filament pair declared in composer.json is exercised at
        # least once, and each major is also resolved against its lowest versions.
        include:
          - { php: '8.2', laravel: '11.*', testbench: '^9.14', filament: '4.*', stability: prefer-lowest }
          - { php: '8.3', laravel: '11.*', testbench: '^9.14', filament: '5.*', stability: prefer-stable }
          - { php: '8.3', laravel: '12.*', testbench: '^10.10', filament: '4.*', stability: prefer-stable }
          - { php: '8.4', laravel: '12.*', testbench: '^10.10', filament: '5.*', stability: prefer-lowest }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', filament: '4.*', stability: prefer-stable }
          - { php: '8.5', laravel: '13.*', testbench: '^11.0', filament: '5.*', stability: prefer-stable }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Filament ${{ matrix.filament }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest --no-coverage
